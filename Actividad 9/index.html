<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario Online - Suscripción</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Diario Online</h1>
        <p>Información actualizada todos los días</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Política</a>
        <a href="#">Deportes</a>
        <a href="#">Tecnología</a>
        <a href="#">Suscripción</a>
    </nav>

    <main>
        <section class="formulario">
            <h2>Formulario de suscripción</h2>

            <form id="formSuscripcion">

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre">
                    <p class="error" id="error-nombre"></p>
                </div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                    <p class="error" id="error-email"></p>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password">
                    <p class="error" id="error-password"></p>
                </div>

                <div class="campo">
                    <label for="repetirPassword">Repetir contraseña</label>
                    <input type="password" id="repetirPassword" name="repetirPassword">
                    <p class="error" id="error-repetirPassword"></p>
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad">
                    <p class="error" id="error-edad"></p>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono">
                    <p class="error" id="error-telefono"></p>
                </div>

                <div class="campo">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion">
                    <p class="error" id="error-direccion"></p>
                </div>

                <div class="campo">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad">
                    <p class="error" id="error-ciudad"></p>
                </div>

                <div class="campo">
                    <label for="codigoPostal">Código postal</label>
                    <input type="text" id="codigoPostal" name="codigoPostal">
                    <p class="error" id="error-codigoPostal"></p>
                </div>

                <div class="campo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni">
                    <p class="error" id="error-dni"></p>
                </div>

                <div class="botonera">
                    <button type="submit">Enviar</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>Diario Online © 2026 - Todos los derechos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
